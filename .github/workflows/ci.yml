name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The UI answers from outside the host, its first admin password is in
      # its log, and the conn3x it runs is the pinned one. Again after a
      # restart, which must keep the database and key.
      - name: Reach the UI, and again after a restart
        run: |
          check() {
            curl -fsS --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 -o login.html http://127.0.0.1:8080/login
            grep -qi 'sign in' login.html
          }
          check
          podman exec circuit-conn3x-ui sh -c 'journalctl -u conn3x-ui --no-pager | grep -qi password'
          podman exec circuit-conn3x-ui sh -c 'test "$(stat -c %a /etc/conn3x-ui/key)" = 640'
          want=$(sed -n '/variable "conn3x_version"/,/}/s/^ *default *= *"\(.*\)"/\1/p' variables.tf)
          podman exec circuit-conn3x-ui runuser -u conn3x-ui -- env PATH="/opt/conn3x-ui/conn3x-$want:/usr/bin:/bin" conn3x version | grep -F "Conn3x v$want"
          podman exec circuit-conn3x-ui systemctl restart conn3x-ui
          check
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
